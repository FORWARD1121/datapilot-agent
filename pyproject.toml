[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datapilot-agent"
version = "0.1.0"
description = "Evidence-grounded analysis with deterministic tools and a bounded LLM workflow"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
dependencies = [
  "fastapi>=0.128.2,<0.129", "uvicorn>=0.48,<0.49",
  "pandas>=2.2.3,<2.3", "numpy>=2.2,<3", "pydantic>=2.13.4,<3",
  "pydantic-settings>=2.14.1,<3", "SQLAlchemy>=2.0.50,<2.1",
  "httpx>=0.28.1,<0.29", "openpyxl>=3.1.5,<3.2",
  "defusedxml>=0.7.1,<0.8", "python-multipart>=0.0.29,<0.1"
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "pytest-cov>=7,<8", "ruff>=0.12,<1"]
mysql = ["pymysql>=1.1,<2"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["prompts/*.txt", "configs/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
